[package]
name = "obsidian-ai-desktop"
version = "0.1.0"
description = "ObsidianAI desktop shell"
authors = ["Just2Alim"]
edition = "2021"

[lib]
name = "obsidian_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
